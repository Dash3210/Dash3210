  86.8% { transform: translate(-145px,183px) rotate(36deg) scale(1.08); }
  88%       { transform: translate(0,0) rotate(0deg) scale(1); fill: #ffd166; }
  92%, 100% { transform: translate(0,0) rotate(0deg) scale(1); fill: #e9eff8; }
}

@keyframes lev0 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-3.6px); } }
@keyframes lev1 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-4.0px); } }
@keyframes lev2 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-4.3px); } }
@keyframes lev3 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-2.8px); } }
@keyframes lev4 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-3.8px); } }
@keyframes lev6 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-3.9px); } }
@keyframes lev7 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-3.0px); } }
@keyframes lev8 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-4.7px); } }
@keyframes lev9 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-3.2px); } }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.45"/>
  <rect class="lamp" width="1280" height="360" fill="url(#lamp)"/>

  <rect x="80" y="112" width="48" height="3" rx="1.5" fill="#38bdf8"/>

  <g class="lev" style="animation: lev0 5.30s ease-in-out -3.88s infinite"><text class="glyph" style="animation: fly0 16s linear infinite" x="105.8" y="205">D</text></g>
  <g class="lev" style="animation: lev1 4.25s ease-in-out -0.56s infinite"><text class="glyph" style="animation: fly1 16s linear infinite" x="156.2" y="205">A</text></g>
  <g class="lev" style="animation: lev2 4.50s ease-in-out -3.1s infinite"><text class="glyph" style="animation: fly2 16s linear infinite" x="205.1" y="205">K</text></g>
  <g class="lev" style="animation: lev3 5.34s ease-in-out -4.75s infinite"><text class="glyph" style="animation: fly3 16s linear infinite" x="251.0" y="205">S</text></g>
  <g class="lev" style="animation: lev4 5.02s ease-in-out -3.88s infinite"><text class="glyph" style="animation: fly4 16s linear infinite" x="298.4" y="205">H</text></g>
  <g class="lev" style="animation: lev6 3.73s ease-in-out -1.54s infinite"><text class="glyph" style="animation: fly6 16s linear infinite" x="366.3" y="205">S</text></g>
  <g class="lev" style="animation: lev7 4.79s ease-in-out -0.77s infinite"><text class="glyph" style="animation: fly7 16s linear infinite" x="413.7" y="205">H</text></g>
  <g class="lev" style="animation: lev8 4.58s ease-in-out -3.61s infinite"><text class="glyph" style="animation: fly8 16s linear infinite" x="464.2" y="205">A</text></g>
  <g class="lev" style="animation: lev9 5.21s ease-in-out -1.5s infinite"><text class="glyph" style="animation: fly9 16s linear infinite" x="514.7" y="205">H</text></g>

  <text class="role" x="82" y="252">MACHINE LEARNING ENGINEER</text>
  <text class="meta" x="82" y="284">Computer vision / explainable AI / forecasting systems</text>

