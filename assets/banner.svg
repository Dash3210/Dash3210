  <path class="runner" d="M80 330 L140 321 L200 326 L260 308 L320 317 L380 300 L440 311 L500 293 L560 305 L620 281 L680 296 L740 277 L800 290 L860 271 L920 285 L980 266 L1040 281 L1100 262 L1160 276 L1200 268"
