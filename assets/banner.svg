  71.0% { transform: translate(209px,136px) rotate(24deg) scale(0.84); }
  79.0% { transform: translate(328px,197px) rotate(232deg) scale(1.01); fill: #ffe9b8; }
  85.0% { transform: translate(-234px,51px) rotate(-107deg) scale(0.99); }
  88%       { transform: translate(0,0) rotate(0deg) scale(1); fill: #ffd166; }
  92%, 100% { transform: translate(0,0) rotate(0deg) scale(1); fill: #e9eff8; }
}
@keyframes fly4 {
  0%, 60%   { transform: translate(0,0) rotate(0deg) scale(1); fill: #e9eff8; }
  65.4% { transform: translate(59px,-43px) rotate(61deg) scale(1.03); fill: #fff3d6; }
  71.4% { transform: translate(131px,-96px) rotate(153deg) scale(1.05); }
  79.4% { transform: translate(422px,-68px) rotate(-106deg) scale(0.91); fill: #ffe9b8; }
  85.4% { transform: translate(-198px,-43px) rotate(49deg) scale(0.78); }
  88%       { transform: translate(0,0) rotate(0deg) scale(1); fill: #ffd166; }
  92%, 100% { transform: translate(0,0) rotate(0deg) scale(1); fill: #e9eff8; }
}
@keyframes fly5 {
  0%, 60%   { transform: translate(0,0) rotate(0deg) scale(1); fill: #e9eff8; }
  65.8% { transform: translate(87px,24px) rotate(46deg) scale(0.98); fill: #fff3d6; }
  71.8% { transform: translate(194px,54px) rotate(115deg) scale(0.97); }
