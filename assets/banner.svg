<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Daksh Shah, Machine Learning Engineer. An animated pull switch: pull to light the name, watch it scatter, then the bulb shorts and everything returns.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c16"/><stop offset="55%" stop-color="#0c1424"/><stop offset="100%" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/><stop offset="25%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#22d3ee" stop-opacity="0.85"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.15" r="0.85">
      <stop offset="0%" stop-color="#fff3d0" stop-opacity="0.85"/><stop offset="45%" stop-color="#ffd48a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#16223a" stroke-width="1"/>
    </pattern>
    <style>
      .glyph { font: 700 66px "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #e9eff8; letter-spacing: -1px; text-anchor: middle; transform-box: fill-box; transform-origin: 50% 50%; }
      .lev   { transform-box: fill-box; transform-origin: 50% 50%; }
      .role  { font: 500 19px "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #93a9c0; letter-spacing: 3.4px; }
      .meta  { font: 400 17px "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #6f879e; letter-spacing: 0.4px; }
      .pull  { font: 600 13px "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #7c93aa; letter-spacing: 2.4px; text-anchor: middle; }

      .lamp { animation: lamp 16s linear infinite; opacity: 0; }
      @keyframes lamp {
        0%, 61%   { opacity: 0; }
        64%       { opacity: 0.15; }
        65%, 66%  { opacity: 0.9; }
        72%       { opacity: 0.75; }
        84%       { opacity: 0.55; }
        86%       { opacity: 0.9; }
        87%       { opacity: 0.12; }
        88%       { opacity: 0.75; }
        89%       { opacity: 0.05; }
        90%       { opacity: 0.45; }
        91%, 100% { opacity: 0; }
      }

      .cord { animation: cord 16s linear infinite; }
      @keyframes cord { 0%,59% { transform: translateY(0); } 62% { transform: translateY(14px); } 64% { transform: translateY(9px); } 67%,100% { transform: translateY(0); } }

      .trace { animation: trace 16s linear infinite; }
      @keyframes trace {
        0%,61% { opacity: 0.55; } 65%,86% { opacity: 1; } 87% { opacity: 0.3; }
        88% { opacity: 0.9; } 89% { opacity: 0.2; } 90%,100% { opacity: 0.55; }
      }
      .runner { animation: run 7s linear infinite; }
      @keyframes run { from { stroke-dashoffset: 1510; } to { stroke-dashoffset: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .glyph, .lev, .lamp, .cord, .trace, .runner { animation: none !important; opacity: 1; }
        .lamp { opacity: 0; }
        .trace { opacity: 0.55; }
      }

@keyframes fly0 {
  0%, 60%   { transform: translate(0,0) rotate(0deg) scale(1); fill: #e9eff8; }
  64.0% { transform: translate(63px,-45px) rotate(16deg) scale(0.96); fill: #fff3d6; }
  70.0% { transform: translate(139px,-100px) rotate(41deg) scale(0.93); }
  78.0% { transform: translate(338px,-91px) rotate(227deg) scale(1.48); fill: #ffe9b8; }
  84.0% { transform: translate(187px,-54px) rotate(-27deg) scale(1.09); }
  88%       { transform: translate(0,0) rotate(0deg) scale(1); fill: #ffd166; }
  92%, 100% { transform: translate(0,0) rotate(0deg) scale(1); fill: #e9eff8; }
}
@keyframes fly1 {
