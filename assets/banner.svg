}
@keyframes fly6 {
  0%, 60%   { transform: translate(0,0) rotate(0deg) scale(1); fill: #e9eff8; }
  66.1% { transform: translate(24px,-55px) rotate(-17deg) scale(0.99); fill: #fff3d6; }
  72.1% { transform: translate(54px,-122px) rotate(-43deg) scale(0.99); }
  80.1% { transform: translate(-200px,70px) rotate(-320deg) scale(1.29); fill: #ffe9b8; }
  86.1% { transform: translate(56px,-43px) rotate(-104deg) scale(0.95); }
  88%       { transform: translate(0,0) rotate(0deg) scale(1); fill: #ffd166; }
  92%, 100% { transform: translate(0,0) rotate(0deg) scale(1); fill: #e9eff8; }
}
@keyframes fly7 {
  0%, 60%   { transform: translate(0,0) rotate(0deg) scale(1); fill: #e9eff8; }
  66.5% { transform: translate(-121px,-27px) rotate(-0deg) scale(1.09); fill: #fff3d6; }
  72.5% { transform: translate(-268px,-61px) rotate(-1deg) scale(1.18); }
  80.5% { transform: translate(-257px,-30px) rotate(213deg) scale(1.48); fill: #ffe9b8; }
  86.5% { transform: translate(-59px,165px) rotate(-113deg) scale(0.97); }
  88%       { transform: translate(0,0) rotate(0deg) scale(1); fill: #ffd166; }
  92%, 100% { transform: translate(0,0) rotate(0deg) scale(1); fill: #e9eff8; }
}
@keyframes fly8 {
  0%, 60%   { transform: translate(0,0) rotate(0deg) scale(1); fill: #e9eff8; }
  66.8% { transform: translate(104px,35px) rotate(6deg) scale(0.88); fill: #fff3d6; }
  72.8% { transform: translate(232px,77px) rotate(14deg) scale(0.75); }
